# Generate and commit the standard Gradle Wrapper files used for reproducible local builds.
name: Generate Gradle Wrapper

on:
  # A workflow edit triggers one regeneration. The wrapper commit itself does not match this path,
  # so the workflow cannot enter a self-triggering commit loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-gradle-wrapper.yml'
  workflow_dispatch:

# Write access is required only so the job can commit the four official wrapper files.
# No application source, manifest, documentation or signing material is modified by this workflow.
permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Wrapper must be generated against this repository's real Gradle settings/build scripts.
      - name: Checkout source
        uses: actions/checkout@v4

      # Gradle 9.5.0 is the repository's pinned toolchain version.
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Generate the official Unix/Windows scripts, properties and gradle-wrapper.jar.
      - name: Generate wrapper files
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin --no-daemon

      # Commit ONLY the wrapper outputs. Explicit paths prevent this utility workflow from
      # accidentally committing unrelated workspace changes in the future.
      - name: Commit official wrapper files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the executable bit expected by Linux/macOS users.
          chmod +x gradlew
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git update-index --chmod=+x gradlew

          if git diff --cached --quiet; then
            echo "Gradle Wrapper 9.5.0 is already committed."
            exit 0
          fi

          git commit -m "Add official Gradle 9.5.0 wrapper"
          git push

      # Keep an artifact copy as an independent recovery/reference package.
      - name: Upload wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-9.5.0
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
