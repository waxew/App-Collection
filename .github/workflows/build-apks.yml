# Build all 78 APKs whenever source is pushed to main.
# Build revision 2: source generation is complete; this revision validates the published tree.
name: Build 78 Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify generated sources exist
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -type d -name '[0-9][0-9]-*' | wc -l)" -eq 78
          test -f settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 37 and Build Tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build all debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APKs with unique names
        shell: bash
        run: |
          mkdir -p apk-output
          for module in [0-9][0-9]-*; do
            apk="$module/build/outputs/apk/debug/$module-debug.apk"
            # AGP normally names the APK after the project module; fall back to the first debug APK.
            if [ ! -f "$apk" ]; then
              apk=$(find "$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' | head -n 1)
            fi
            if [ -n "$apk" ] && [ -f "$apk" ]; then
              cp "$apk" "apk-output/$module.apk"
            fi
          done
          count=$(find apk-output -name '*.apk' | wc -l)
          echo "Collected $count APKs"
          test "$count" -eq 78

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-collection-78-apks
          path: apk-output/*.apk
          if-no-files-found: error
