# Build, version, validate and package all 78 Android applications.
#
# Important signing and update rules:
# - Debug APKs are development/test artifacts only.
# - Release APKs produced here are intentionally UNSIGNED.
# - The private release signing key must never be committed to this public repository.
# - Final distributable APKs must always be signed with the SAME stable release key.
# - CI injects a monotonically increasing versionCode and a user-facing versionName.
# - apkanalyzer reads manifest metadata back from every APK so filenames cannot hide bad versioning.
name: Build 78 Android APKs

on:
  push:
    branches: [main]
    # Documentation-only commits should not spend several minutes rebuilding 78 applications.
    # Any source, manifest, Gradle or workflow change that can affect APK bytes still triggers CI.
    paths:
      - '[0-9][0-9]-*/**'
      - 'shared-ui/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Fetch the complete repository at the commit that triggered this workflow.
      - name: Checkout source
        uses: actions/checkout@v4

      # Guard against an incomplete generated repository or accidental preview-SDK changes.
      - name: Verify generated sources exist
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -type d -name '[0-9][0-9]-*' | wc -l)" -eq 78
          test -f settings.gradle.kts
          test -f CATALOG.md
          ! grep -R 'compileSdk = 37\|targetSdk = 37' --include='*.kts' .

      # AGP 9.x is run with JDK 17 in CI for deterministic builds.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install the official Android SDK command-line environment.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Android 16 / API 36 is the stable SDK used by all modules in this repository.
      - name: Install stable Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Keep the Gradle version explicit so builds do not depend on the runner image default.
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # GitHub run numbers increase on every run and therefore give Android a newer package version.
      # The +1000 offset keeps CI-produced packages above the original versionCode=1 local builds.
      - name: Calculate release version metadata
        shell: bash
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.0"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Using Android versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      # Build both variants with the same verified release metadata.
      # Release remains unsigned because the production key is private and must not live in GitHub.
      - name: Build debug and unsigned release APKs
        run: >-
          gradle assembleDebug assembleRelease
          -PreleaseVersionCode="$ANDROID_VERSION_CODE"
          -PreleaseVersionName="$ANDROID_VERSION_NAME"
          --no-daemon --stacktrace

      # Verify every debug APK signature and read authoritative manifest values back from the APK.
      #
      # Legacy `aapt dump badging` is intentionally avoided for metadata verification. On API 36 it
      # can attempt to resolve framework drawable resources referenced by the manifest and return a
      # false failure even when the package is valid. `apkanalyzer manifest` reads each field
      # directly and therefore matches the information Android PackageManager consumes.
      - name: Verify debug APK signatures and metadata
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          checked=0

          for module in [0-9][0-9]-*; do
            apk=$(find "$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' | head -n 1)
            test -n "$apk"
            test -f "$apk"

            # Debug APK must be properly signed by the Android debug signing configuration.
            "$APKSIGNER" verify --verbose --print-certs "$apk" >/dev/null

            # Convert folder number (01..78) to the expected stable applicationId suffix.
            module_number=${module%%-*}
            expected_package="com.asteam.appcollection.p${module_number}"

            # Verify exactly what PackageManager will see after installation.
            test "$("$APKANALYZER" manifest application-id "$apk")" = "$expected_package"
            test "$("$APKANALYZER" manifest version-code "$apk")" = "$ANDROID_VERSION_CODE"
            test "$("$APKANALYZER" manifest version-name "$apk")" = "$ANDROID_VERSION_NAME"

            checked=$((checked + 1))
          done
          echo "Verified signatures, package IDs and metadata for $checked debug APKs"
          test "$checked" -eq 78

      # Verify authoritative manifest values inside every unsigned release APK before private signing.
      - name: Verify unsigned release APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          checked=0

          for module in [0-9][0-9]-*; do
            apk=$(find "$module/build/outputs/apk/release" -maxdepth 1 -name '*-unsigned.apk' | head -n 1)
            test -n "$apk"
            test -f "$apk"

            module_number=${module%%-*}
            expected_package="com.asteam.appcollection.p${module_number}"

            test "$("$APKANALYZER" manifest application-id "$apk")" = "$expected_package"
            test "$("$APKANALYZER" manifest version-code "$apk")" = "$ANDROID_VERSION_CODE"
            test "$("$APKANALYZER" manifest version-name "$apk")" = "$ANDROID_VERSION_NAME"

            checked=$((checked + 1))
          done
          echo "Verified package IDs and metadata for $checked unsigned release APKs"
          test "$checked" -eq 78

      # Collect debug APKs under predictable names. These are useful for developer QA only.
      - name: Collect debug APKs
        shell: bash
        run: |
          mkdir -p apk-debug-output
          for module in [0-9][0-9]-*; do
            apk=$(find "$module/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' | head -n 1)
            if [ -n "$apk" ] && [ -f "$apk" ]; then
              cp "$apk" "apk-debug-output/$module-debug-v$ANDROID_VERSION_NAME-vc$ANDROID_VERSION_CODE.apk"
            fi
          done
          count=$(find apk-debug-output -name '*.apk' | wc -l)
          echo "Collected $count debug APKs"
          test "$count" -eq 78

      # Collect release variants before production signing. They carry verified version metadata.
      - name: Collect unsigned release APKs
        shell: bash
        run: |
          mkdir -p apk-release-unsigned-output
          for module in [0-9][0-9]-*; do
            apk=$(find "$module/build/outputs/apk/release" -maxdepth 1 -name '*-unsigned.apk' | head -n 1)
            if [ -n "$apk" ] && [ -f "$apk" ]; then
              cp "$apk" "apk-release-unsigned-output/$module-release-v$ANDROID_VERSION_NAME-vc$ANDROID_VERSION_CODE-unsigned.apk"
            fi
          done
          count=$(find apk-release-unsigned-output -name '*.apk' | wc -l)
          echo "Collected $count unsigned release APKs"
          test "$count" -eq 78

      # Keep the development artifacts clearly labelled so they cannot be confused with production.
      - name: Upload debug test APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-collection-78-debug-test-apks-v${{ env.ANDROID_VERSION_NAME }}-vc${{ env.ANDROID_VERSION_CODE }}
          path: apk-debug-output/*.apk
          if-no-files-found: error

      # Upload unsigned release APKs for the private stable-signing stage.
      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-collection-78-release-unsigned-v${{ env.ANDROID_VERSION_NAME }}-vc${{ env.ANDROID_VERSION_CODE }}
          path: apk-release-unsigned-output/*.apk
          if-no-files-found: error

      # Export only official signing utilities needed by the private local signing step.
      # aapt is retained in the utility artifact for generic Android inspection, but CI manifest
      # verification above deliberately uses apkanalyzer for API-36-safe metadata reads.
      - name: Prepare Android signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          LIBCPP=$(find "$ANDROID_HOME/build-tools/36.0.0" -type f -name 'libc++.so' | head -n 1)
          test -n "$LIBCPP"
          cp "$LIBCPP" signing-tools/lib64/libc++.so
          chmod +x signing-tools/apksigner signing-tools/zipalign signing-tools/aapt

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36-signing
          path: signing-tools
          if-no-files-found: error
