# Launch every rebuilt Activity on a real Android emulator and fail CI on runtime crashes.
name: Emulator smoke test 78 activities

on:
  push:
    branches: [main]
    paths:
      - 'test-host/**'
      - '[0-9][0-9]-*/src/main/java/**'
      - 'shared-ui/**'
      - '.github/workflows/emulator-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    # The JUnit sweep itself has a three-minute timeout. This job timeout additionally bounds
    # emulator image provisioning/boot so a broken runner cannot occupy CI indefinitely.
    timeout-minutes: 25

    steps:
      # Use the exact repository revision that triggered the validation run.
      - name: Checkout source
        uses: actions/checkout@v4

      # AGP 9.x is validated with JDK 17 in the rest of this repository as well.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provide sdkmanager/adb before the emulator action prepares its system image.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The application compiles/targets stable Android 16 / API 36. Runtime smoke testing uses the
      # mature API-35 Google APIs emulator because the test only needs a compatible Android runtime;
      # compile/target compatibility continues to be checked independently by the API-36 builds.
      - name: Install Android 16 build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Keep Gradle deterministic instead of relying on the runner image's bundled version.
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Compile the application and instrumentation APKs before emulator boot. Direct class
      # references inside AllActivitiesSmokeTest make a missing/renamed p01..p78 Activity a compile
      # failure before any device time is spent.
      - name: Compile instrumentation test APK
        working-directory: test-host
        run: ../gradlew -p . :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      # Install both APKs explicitly with adb and invoke AndroidJUnitRunner directly.
      #
      # Why not `connectedDebugAndroidTest` here?
      # The original run failed inside AGP/UTP's device-controller layer before JUnit reached a
      # single Activity. Manual adb install + `am instrument` removes that extra layer while running
      # the same compiled AndroidJUnitRunner/ActivityScenario test on the emulator.
      - name: Launch all 78 activities through direct instrumentation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
            adb devices -l

            APP_APK="test-host/app/build/outputs/apk/debug/app-debug.apk"
            TEST_APK="test-host/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            test -f "$APP_APK"
            test -f "$TEST_APK"

            # Fresh installation prevents stale package/test state from affecting the smoke run.
            adb uninstall com.asteam.appcollection.test >/dev/null 2>&1 || true
            adb uninstall com.asteam.appcollection.test.test >/dev/null 2>&1 || true
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"

            # Resolve the runner from PackageManager rather than hard-coding an implementation
            # detail. Normalize CR characters because adb shell output may use device line endings.
            adb shell pm list instrumentation | tr -d '\r' > test-host/emulator-instrumentations.txt
            cat test-host/emulator-instrumentations.txt
            INSTRUMENTATION=$(sed -n \
              's/^instrumentation:\([^ ]*com\.asteam\.appcollection\.test\.test[^ ]*\).*/\1/p' \
              test-host/emulator-instrumentations.txt | head -n 1)

            if [ -z "$INSTRUMENTATION" ]; then
              echo "ERROR: AndroidJUnitRunner for com.asteam.appcollection.test.test was not registered."
              exit 1
            fi

            # Capture logcat from a clean buffer so any Activity crash is available even when the
            # instrumentation summary itself is short.
            adb logcat -c

            # Do NOT pipe am-instrument through tee here. Some action shells do not expose Bash's
            # PIPESTATUS consistently, which can turn a valid Android result into a shell failure or
            # hide the real runner exit status. Redirect directly, save $?, then print the file.
            set +e
            adb shell am instrument -w -r "$INSTRUMENTATION" \
              > test-host/emulator-instrumentation.txt 2>&1
            INSTRUMENTATION_EXIT=$?
            set -e

            # Normalize device line endings before validating JUnit's final result line.
            tr -d '\r' < test-host/emulator-instrumentation.txt \
              > test-host/emulator-instrumentation-normalized.txt
            cat test-host/emulator-instrumentation-normalized.txt
            adb logcat -d > test-host/emulator-logcat.txt

            # A nonzero runner status is always a hard failure.
            test "$INSTRUMENTATION_EXIT" -eq 0

            # AndroidJUnitRunner can occasionally return shell success while the textual JUnit
            # summary reports a failure. Require the explicit successful one-test summary as well.
            grep -Eq '^OK \(1 test\)[[:space:]]*$' \
              test-host/emulator-instrumentation-normalized.txt

            # The bounded test writes START/DONE markers for every numbered Activity. Independently
            # require all 78 DONE markers so an accidentally shortened test cannot masquerade as OK.
            DONE_COUNT=$(grep -c 'AppCollectionSmoke.*DONE p' test-host/emulator-logcat.txt || true)
            echo "Completed Activity smoke markers: $DONE_COUNT"
            test "$DONE_COUNT" -eq 78

      # Preserve both Gradle reports and direct-device diagnostics regardless of success/failure.
      # Future failures therefore identify whether the issue was install, runner registration,
      # Activity lifecycle, assertion, timeout, or an Android process crash.
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-collection-emulator-smoke-test-report
          path: |
            test-host/app/build/reports/androidTests/**
            test-host/app/build/outputs/androidTest-results/**
            test-host/emulator-instrumentation.txt
            test-host/emulator-instrumentation-normalized.txt
            test-host/emulator-instrumentations.txt
            test-host/emulator-logcat.txt
          if-no-files-found: warn
