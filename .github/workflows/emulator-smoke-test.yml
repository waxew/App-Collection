# Launch every rebuilt Activity on a real Android emulator and fail CI on runtime crashes.
name: Emulator smoke test 78 activities

on:
  push:
    branches: [main]
    paths:
      - 'test-host/**'
      - '[0-9][0-9]-*/src/main/java/**'
      - 'shared-ui/**'
      - '.github/workflows/emulator-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Use the exact repository revision that triggered the validation run.
      - name: Checkout source
        uses: actions/checkout@v4

      # AGP 9.x is validated with JDK 17 in the rest of this repository as well.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provide sdkmanager/adb before the emulator action prepares its system image.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The application still compiles/targets stable Android 16 / API 36. Runtime smoke testing is
      # intentionally performed on API 35 because the previous API-36 GitHub AVD was connected by
      # adb but reported as an unknown/incompatible API to AGP's connected-device test runner. The
      # JUnit report proved no Activity test had started. API 35 remains fully compatible with this
      # minSdk=23 application and provides a mature, deterministic CI runtime for launch/crash QA.
      - name: Install Android 16 build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Keep Gradle deterministic instead of relying on the runner image's bundled version.
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Compile androidTest before emulator boot so dependency or direct-class-reference errors
      # fail quickly and are reported separately from device/runtime failures.
      - name: Compile instrumentation test APK
        working-directory: test-host
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      # ActivityScenario opens each of the 78 real Activities, waits for initial lifecycle delivery,
      # and closes it before moving to the next. The diagnostic getprop/adb commands run first so a
      # future infrastructure problem is distinguishable from an application crash in the CI log.
      - name: Launch all 78 activities on stable Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
            adb devices -l
            cd test-host
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace --info

      # Preserve JUnit/XML and HTML reports even when a future Activity fails, making the exact
      # numbered sample and stack trace available instead of a generic "could not run" message.
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-collection-emulator-smoke-test-report
          path: |
            test-host/app/build/reports/androidTests/**
            test-host/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
