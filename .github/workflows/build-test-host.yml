# Build only the consolidated single-install test application.
name: Build single Test APK

on:
  push:
    branches: [main]
    paths:
      - 'test-host/**'
      - '[0-9][0-9]-*/src/main/java/**'
      - 'shared-ui/**'
      - '.github/workflows/build-test-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # Build from the nested standalone host project so the 78 original application modules
      # remain independent reference projects and are not installed separately.
      # Direct class references in TestLauncherActivity make a missing source fail compilation.
      - name: Build consolidated debug and release APK
        working-directory: test-host
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      # Structural runtime guard: the first broken host build compiled because only the textual
      # p01..p78 class names were present. This check inspects all generated DEX files and requires
      # the real class descriptor for every numbered MainActivity before an artifact is uploaded.
      - name: Verify all 78 activities are embedded in DEX
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find test-host/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          rm -rf /tmp/test-host-dex
          mkdir -p /tmp/test-host-dex
          unzip -q "$APK" 'classes*.dex' -d /tmp/test-host-dex
          strings /tmp/test-host-dex/classes*.dex > /tmp/test-host-dex/all-strings.txt

          missing=0
          for n in $(seq -w 1 78); do
            descriptor="Lcom/asteam/appcollection/p${n}/MainActivity;"
            if ! grep -Fq "$descriptor" /tmp/test-host-dex/all-strings.txt; then
              echo "ERROR: missing embedded activity p${n}: $descriptor"
              missing=$((missing + 1))
            fi
          done

          echo "Missing embedded activities: $missing"
          test "$missing" -eq 0

      - name: Verify debug APK signature
        shell: bash
        run: |
          APK=$(find test-host/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p test-apk-output
          cp "$(find test-host/app/build/outputs/apk/debug -name '*.apk' | head -n 1)" test-apk-output/Test-debug.apk
          cp "$(find test-host/app/build/outputs/apk/release -name '*-unsigned.apk' | head -n 1)" test-apk-output/Test-release-unsigned.apk
          test -f test-apk-output/Test-debug.apk
          test -f test-apk-output/Test-release-unsigned.apk

      - name: Upload consolidated Test APKs
        uses: actions/upload-artifact@v4
        with:
          name: App-Collection-Single-Test-APK
          path: test-apk-output/*.apk
          if-no-files-found: error
