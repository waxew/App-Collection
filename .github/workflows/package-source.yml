# Package the exact tracked repository revision into a clean source archive for delivery/recovery.
# This delivery revision includes the bounded/logged 78-Activity runtime QA test; this workflow-only
# commit does not alter application or androidTest bytecode and exists to regenerate the source ZIP.
name: Package final source

on:
  # Adding/editing this workflow creates a source artifact automatically. Future releases can also
  # regenerate an archive manually without modifying application code.
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full tracked content is required because git archive packages exactly this checked-out commit.
      - name: Checkout source
        uses: actions/checkout@v4

      # Create a clean ZIP containing tracked project files only. Build directories, IDE caches,
      # local.properties and private signing material are therefore excluded automatically.
      - name: Create source archive and metadata
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ARCHIVE="App-Collection-source-${SHORT_SHA}.zip"

          git archive --format=zip --prefix="App-Collection/" -o "$ARCHIVE" "$GITHUB_SHA"

          # Delivery metadata makes the archive independently traceable without opening GitHub.
          cat > SOURCE-BUILD-INFO.txt <<EOF
          Repository: waxew/App-Collection
          Commit: $GITHUB_SHA
          Short commit: $SHORT_SHA
          Source archive: $ARCHIVE
          Generated by: GitHub Actions / Package final source
          Tracked source only: yes
          Private signing key included: no
          EOF

          sha256sum "$ARCHIVE" > SOURCE-SHA256.txt
          test -s "$ARCHIVE"
          test -s SOURCE-SHA256.txt

      # Keep source, provenance information and checksum together in one downloadable artifact.
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: App-Collection-final-source-${{ github.sha }}
          path: |
            App-Collection-source-*.zip
            SOURCE-BUILD-INFO.txt
            SOURCE-SHA256.txt
          if-no-files-found: error
