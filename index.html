<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <!-- هاب مرکزی نسخه وب تمام پروژه‌های AS Team؛ فقط همین ریپو باید GitHub Pages فعال داشته باشد. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>AS Team | Web Projects</title>
  <style>
    /* Design System مشترک نسخه وب؛ بدون کتابخانه خارجی تا GitHub Pages سریع و پایدار بماند. */
    :root{--bg:#f3f5f8;--surface:#fff;--surface2:#f8fafc;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#6956e8;--accent2:#8d7ff5;--shadow:0 18px 48px rgba(16,24,40,.10)}
    [data-theme="dark"]{--bg:#090f1d;--surface:#111827;--surface2:#182132;--text:#f9fafb;--muted:#98a2b3;--line:#263244;--shadow:0 18px 48px rgba(0,0,0,.34)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 28px rgba(105,86,232,.26)}
    .top-actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:9px 12px}
    .wrap{width:min(1180px,calc(100% - 28px));margin:26px auto 60px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
    .hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.hero-main{padding:27px}.hero h1{font-size:clamp(26px,4vw,44px);margin:12px 0 8px}.hero p{margin:0;color:var(--muted);line-height:2}.pill{display:inline-flex;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px}.stats{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border:1px solid var(--line);background:var(--surface2);border-radius:18px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--text);padding:12px 14px;outline:none}.chip{border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);padding:9px 13px}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:21px;background:var(--surface);color:inherit;text-decoration:none;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-3px);border-color:var(--accent)}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.appicon{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px}.badge{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted)}.card h3{margin:0;font-size:16px}.card p{margin:0;color:var(--muted);line-height:1.8;font-size:12px}
    .preview{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}.side{padding:22px}.side h1{margin:10px 0 6px;font-size:28px}.side p{color:var(--muted);font-size:13px;line-height:1.9}.list{display:grid;gap:8px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.row span{color:var(--muted);font-size:11px}.primary,.secondary{width:100%;padding:12px 14px;border-radius:14px;font-weight:800;margin-top:9px}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--surface);color:var(--text)}
    .phone{width:min(100%,430px);margin:auto;overflow:hidden;min-height:650px;border:7px solid #171a22;border-radius:36px;background:var(--surface);box-shadow:0 28px 70px rgba(16,24,40,.22)}.phonebar{display:flex;justify-content:space-between;align-items:center;padding:16px 17px 12px;border-bottom:1px solid var(--line)}.phonebar b{display:block}.phonebar small{color:var(--muted)}.phonebody{padding:15px}.welcome{padding:18px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 34px rgba(105,86,232,.23)}.welcome h2{margin:0 0 6px;font-size:20px}.welcome p{margin:0;line-height:1.8;font-size:12px;opacity:.92}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.feature{min-height:94px;padding:14px;text-align:right;border:1px solid var(--line);border-radius:17px;background:var(--surface2);color:var(--text)}.feature.active{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}.feature b{display:block;margin:7px 0 4px}.feature span{font-size:11px;color:var(--muted)}.bottom{display:grid;grid-template-columns:repeat(4,1fr);margin-top:15px;border-top:1px solid var(--line)}.bottom button{border:0;background:transparent;color:var(--muted);padding:13px 4px;font-size:11px}.bottom button.active{color:var(--accent);font-weight:900}.empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.9;margin-top:24px}
    @media(max-width:900px){.hero,.preview{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.side{order:-1}}
    @media(max-width:560px){.wrap{width:calc(100% - 18px);margin-top:13px}.grid{grid-template-columns:1fr}.hero-main{padding:20px}.stats{padding:12px}.top{padding:9px 11px}.brand small{display:none}.phone{border-width:5px;border-radius:29px;min-height:610px}}
  </style>
</head>
<body>
  <!-- نوار بالا برای بازگشت به هاب و تغییر تم. -->
  <header class="top"><div class="brand"><div class="logo">AS</div><div>AS Team <small style="color:var(--muted);font-weight:400">Web Preview</small></div></div><div class="top-actions"><button id="home" class="iconbtn">پروژه‌ها</button><button id="theme" class="iconbtn" title="تغییر تم">◐</button></div></header>
  <main id="app" class="wrap"></main>
  <script>
    // Registry مرکزی: تمام پروژه‌های اصلی Android App و AS Academy در یک GitHub Pages نمایش داده می‌شوند.
    const data=[
      ['App-TarikhYar','تاریخ‌یار','app',['تاریخ شمسی','تبدیل تاریخ','مناسبت‌ها','یادآوری']],
      ['App-HesabYar','حسابیار','app',['درصد و تخفیف','سود و افزایش قیمت','تاریخچه محاسبات','ابزارهای مالی']],
      ['App-MDFchi','MDFچی','app',['محاسبات کابینت','لیست برش','متراژ MDF','قیمت پروژه']],
      ['App-QrCodeYar','QR Code Yar','app',['ساخت QR','اسکن کد','تاریخچه','اشتراک‌گذاری']],
      ['App-CC','CC','app',['فروشگاه DTF','ثبت سفارش','باشگاه مشتریان','پروفایل']],
      ['App-Time','Time','app',['زمان و تاریخ','تایمر','یادآور','ابزارهای زمانی']],
      ['App-TelegramBotStore','Telegram Bot Store','app',['محصولات','سفارش‌ها','اشتراک','مدیریت ربات']],
      ['App-FactorYar','فاکتوریار','app',['فاکتور','مشتری‌ها','کالا و خدمات','خروجی و اشتراک']],
      ['App-WaterMark','WaterMark','app',['واترمارک متن','واترمارک تصویر','پردازش گروهی','خروجی']],
      ['App-TabdilYar','تبدیل‌یار','app',['تبدیل واحد','ابزارهای سریع','محاسبه','تاریخچه']],
      ['App-KhayatYar','خیاط‌یار','app',['اندازه‌گیری','الگو','مصرف پارچه','پروژه‌ها']],
      ['App-NaghashYar','نقاش‌یار','app',['متراژ رنگ','مصالح','برآورد هزینه','پروژه‌ها']],
      ['App-KashiYar','کاشی‌یار','app',['متراژ کاشی','تعداد موردنیاز','پرت','برآورد هزینه']],
      ['App-TalaYar','طلا‌یار','app',['محاسبه طلا','اجرت','سود','مالیات']],
      ['App-YadAvarYar','یادآور‌یار','app',['یادآوری','تکرار','دسته‌بندی','اعلان']],
      ['App-NoteYar','نوت‌یار','app',['یادداشت','جستجو','دسته‌بندی','پشتیبان‌گیری']],
      ['App-RouzTech','روزتک','app',['داشبورد','محتوا','جستجو','تنظیمات']],
      ['App-Galata','گالاتا','app',['حسابداری','فاکتورها','مشتری و کالا','یادآورها']],
      ['App-SkincareSaba','Skincare Saba','app',['روتین پوستی','محصولات','یادآوری','پروفایل']],
      ['App-Telegram-CC','Telegram CC','app',['فروشگاه','محصولات','سفارش‌ها','کاربران']],
      ['App-NameDic','NameDic','app',['نام‌ها','معنی نام','جستجو','علاقه‌مندی']],
      ['App-ToolsBox','ToolsBox','app',['ابزارها','محاسبه‌گرها','تبدیل‌ها','جستجو']],
      ['AS-StorageBox','StorageBox','app',['فایل‌ها','پوشه‌ها','اشتراک امن','سطح دسترسی']],
      ['App-Hesabdar','حسابدار','app',['حسابداری','فاکتور','خزانه','گزارش‌ها']],
      ['App-Bot-maneger','Bot Manager','app',['ربات‌ها','وضعیت سرویس','دستورات','کاربران']],
      ['App-Collection','App Collection','app',['نمونه پروژه‌ها','ابزار توسعه','Web Preview','مستندات']],
      ['AS-Academy-Core','Academy Core','academy',['هسته مشترک','Navigation','Progress','Content Engine']],
      ['AS-Academy-Basic','Basic','academy',['مبانی مشترک','الگوریتم','حل مسئله','پروژه']],
      ['AS-Academy-Kotlin','Kotlin','academy',['مبانی','مقدماتی','پیشرفته','تخصصی']],
      ['AS-Academy-Java','Java','academy',['مبانی','مقدماتی','پیشرفته','تخصصی']],
      ['AS-Academy-Python','Python','academy',['مبانی','مقدماتی','پیشرفته','تخصصی']],
      ['AS-Academy-JavaScript','JavaScript','academy',['مبانی','DOM و Web','پیشرفته','پروژه']],
      ['AS-Academy-php','PHP','academy',['مبانی','Web و Forms','OOP','پروژه']],
      ['AS-Academy-C','C','academy',['مبانی','حافظه','Pointers','پروژه']],
      ['AS-Academy-Cplusplus','C++','academy',['مبانی','OOP','STL','پروژه']],
      ['AS-Academy-Csharp','C#','academy',['مبانی','OOP','.NET و LINQ','پروژه']],
      ['AS-Academy-HTML','HTML','academy',['ساختار سند','Semantic HTML','Forms','پروژه']],
      ['AS-Academy-CSS','CSS','academy',['مبانی','Flexbox و Grid','Responsive','پروژه']],
      ['-AS-Academy-LocalDB','Local DB','academy',['SQLite','Room','Migration','Backup و Restore']]
    ].map(([slug,title,type,features])=>({slug,title,type,features}));

    // تمام لینک‌های پروژه عمداً روی هاب مرکزی می‌مانند؛ بنابراین has_pages=false در یک ریپوی فرعی باعث 404 نمی‌شود.
    const centralUrl=p=>`https://waxew.github.io/App-Collection/?project=${encodeURIComponent(p.slug)}`;
    const repoUrl=p=>`https://github.com/waxew/${p.slug}`;
    const qs=new URLSearchParams(location.search);const project=qs.get('project')||'';

    // تم کاربر در LocalStorage حفظ می‌شود.
    document.documentElement.dataset.theme=localStorage.getItem('as-web-theme')||'light';
    document.getElementById('theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('as-web-theme',next)};
    document.getElementById('home').onclick=()=>location.href='https://waxew.github.io/App-Collection/';

    function renderHub(){
      document.title='AS Team | Web Projects';
      const apps=data.filter(x=>x.type==='app').length,academy=data.filter(x=>x.type==='academy').length;
      app.innerHTML=`<section class="hero"><div class="panel hero-main"><span class="pill">GitHub Pages • Central Web Hub</span><h1>نسخه وب پروژه‌های AS Team</h1><p>همه پروژه‌ها از یک هسته مرکزی نمایش داده می‌شوند. این معماری باعث می‌شود حتی ریپوهایی که GitHub Pages اختصاصی ندارند، از همین هاب قابل مشاهده و تست باشند.</p></div><div class="panel stats"><div class="stat"><b>${data.length}</b><span>کل پروژه‌ها</span></div><div class="stat"><b>${apps}</b><span>اپلیکیشن</span></div><div class="stat"><b>${academy}</b><span>AS Academy</span></div><div class="stat"><b>RTL</b><span>Responsive Web</span></div></div></section><div class="toolbar"><input id="q" class="search" placeholder="جستجو بین پروژه‌ها…"><button class="chip active" data-f="all">همه</button><button class="chip" data-f="app">اپ‌ها</button><button class="chip" data-f="academy">Academy</button></div><section id="grid" class="grid"></section><footer>AS Team • Central GitHub Pages Web Preview<br>هر پروژه از طریق پارامتر project آدرس مستقل و قابل اشتراک دارد.</footer>`;
      let filter='all';const grid=document.getElementById('grid');
      const draw=()=>{const q=document.getElementById('q').value.trim().toLowerCase();const rows=data.filter(p=>(filter==='all'||p.type===filter)&&(p.slug.toLowerCase().includes(q)||p.title.toLowerCase().includes(q)||p.features.join(' ').toLowerCase().includes(q)));grid.innerHTML=rows.length?rows.map(p=>`<a class="card" href="?project=${encodeURIComponent(p.slug)}"><div class="card-head"><div class="appicon">${p.type==='academy'?'⌘':p.slug==='AS-StorageBox'?'☁':'◇'}</div><span class="badge">${p.type==='academy'?'Academy':'Web Preview'}</span></div><h3>${p.title}</h3><p>${p.features.join(' • ')}</p></a>`).join(''):'<div class="panel empty">نتیجه‌ای پیدا نشد.</div>'};
      document.getElementById('q').oninput=draw;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;draw()});draw();
    }

    function renderProject(p){
      document.title=`${p.title} | Web Preview`;
      const academy=p.type==='academy';
      app.innerHTML=`<section class="preview"><div class="phone"><div class="phonebar"><div><b>${p.title}</b><small>AS Team • Web Preview</small></div><span>☰</span></div><div class="phonebody"><div class="welcome"><h2>${academy?'مسیر یادگیری شما':'خوش آمدید'}</h2><p>${academy?'نمای دوره از مبانی تا تخصصی؛ درس، مثال، تمرین، آزمون و پروژه در این پوسته قابل توسعه است.':'این نسخه برای بررسی سریع ظاهر، ناوبری و ساختار اصلی اپ در مرورگر ساخته شده است.'}</p></div><input id="fq" class="search" style="width:100%;margin-top:12px" placeholder="${academy?'جستجو در درس‌ها…':'جستجو در امکانات…'}"><div id="features" class="feature-grid"></div><div class="bottom"><button class="active">خانه</button><button>جستجو</button><button>${academy?'پیشرفت':'ذخیره‌ها'}</button><button>تنظیمات</button></div></div></div><aside class="panel side"><span class="pill">${p.slug}</span><h1>${p.title}</h1><p>${academy?'Web Preview دوره آموزشی AS Academy.':'Web Preview پروژه اندرویدی؛ قابلیت‌های وابسته به Android API در APK اصلی اجرا می‌شوند.'}</p><div class="list">${p.features.map((x,i)=>`<div class="row"><b>${x}</b><span>${i+1}/${p.features.length}</span></div>`).join('')}</div><button id="repo" class="primary">مشاهده سورس در GitHub</button><button id="copy" class="secondary">کپی لینک همین نسخه وب</button></aside></section><footer>${centralUrl(p)}</footer>`;
      const features=document.getElementById('features');let selected=Number(localStorage.getItem(`as-web-selected-${p.slug}`)||0);
      const draw=()=>{const q=document.getElementById('fq').value.trim().toLowerCase();const rows=p.features.map((name,i)=>({name,i})).filter(x=>x.name.toLowerCase().includes(q));features.innerHTML=rows.length?rows.map(x=>`<button class="feature ${x.i===selected?'active':''}" data-i="${x.i}"><span>${academy?'مرحله':'بخش'} ${x.i+1}</span><b>${x.name}</b><span>${academy?'درس + مثال + تمرین + آزمون':'ورود به بخش'}</span></button>`).join(''):'<div class="empty">نتیجه‌ای پیدا نشد.</div>';features.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);localStorage.setItem(`as-web-selected-${p.slug}`,selected);draw()})};
      document.getElementById('fq').oninput=draw;draw();document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('repo').onclick=()=>window.open(repoUrl(p),'_blank','noopener');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(centralUrl(p));const b=document.getElementById('copy');b.textContent='لینک کپی شد ✓';setTimeout(()=>b.textContent='کپی لینک همین نسخه وب',1400)}catch{location.href=centralUrl(p)}};
    }

    // اگر project معتبر باشد پیش‌نمایش همان پروژه باز می‌شود؛ در غیر این صورت هاب نمایش داده می‌شود.
    const selected=data.find(x=>x.slug.toLowerCase()===project.toLowerCase());selected?renderProject(selected):renderHub();
  </script>
</body>
</html>
